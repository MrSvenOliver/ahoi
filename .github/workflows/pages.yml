# Veröffentlicht den Ordner public/ bei jeder Änderung auf GitHub Pages
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versionsstempel setzen (damit die App neue Stände selbst erkennt)
        run: |
          V="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$V/g" public/prototyp/app.js
          echo "{\"version\":\"$V\"}" > public/prototyp/version.json
      - name: Echte App aus dem gemeinsamen Code bauen
        run: bash werkzeuge/app-bauen.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
